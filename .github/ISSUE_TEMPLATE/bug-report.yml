name: Report a website problem
description: Describe a reproducible problem using fictional information only.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. For a security vulnerability, use the repository's private vulnerability-reporting channel instead.

        Do not attach student work, reports, names, emails, school IDs, class codes, screenshots containing school information, credentials, private keys, public reporting-key files, or passphrases. Use fictional examples. Browser and device type are enough; do not include identifying account details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Name the public page or lab and describe the problem without personal information.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Include the browser/device type and steps using fictional data. Do not upload a report or key file.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public information check
      options:
        - label: I used fictional examples and did not include student information, class codes, reports, key files, passphrases, or credentials.
          required: true

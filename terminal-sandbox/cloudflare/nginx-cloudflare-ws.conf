# NGINX Reverse Proxy Configuration for Cloudflare WebSockets (Port 443 Only)
# Place behind Cloudflare Orange-Cloud Proxy with SSL/TLS mode set to "Full (Strict)"
# and WebSockets enabled in Cloudflare Dashboard -> Network -> WebSockets.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name terminal.colelearninglabs.com www.colelearninglabs.com;

    # Cloudflare Origin CA Certificate
    ssl_certificate     /etc/ssl/cloudflare/colelearninglabs.pem;
    ssl_certificate_key /etc/ssl/cloudflare/colelearninglabs.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Restore real student IP from Cloudflare edge ranges (IPv4 & IPv6)
    real_ip_header CF-Connecting-IP;

    # Security Headers aligned with Cole Learning Labs _headers policy
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), payment=()" always;

    # Multiplexed WebSocket Tunnel Endpoint (wss://terminal.colelearninglabs.com/ws)
    # Strictly runs over Port 443 (HTTPS) to bypass school firewall blocks on SSH(22)/RDP(3389)/VNC(5900).
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;

        # Required WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward Cloudflare Edge & Client Metadata to Orchestrator
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # Keep connection alive across Cloudflare's 100s idle window (orchestrator sends 30s heartbeats)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Static Frontend & Orchestrator REST API (/api/*)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
    }
}

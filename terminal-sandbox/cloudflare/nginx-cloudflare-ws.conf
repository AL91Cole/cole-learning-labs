# Example only. TLS certificate, dedicated hostname, exact trusted proxy peer and
# school/privacy approval must be configured before enabling this separate service.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 443 ssl;
    server_name terminal.colelearninglabs.com;
    ssl_certificate /etc/ssl/cloudflare/colelearninglabs.pem;
    ssl_certificate_key /etc/ssl/cloudflare/colelearninglabs.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 100k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host terminal.colelearninglabs.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Replace rather than pass through the browser's forwarded protocol.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
